# tmux config for macOS and Linux (tmux 3.4+), managed with chezmoi.
# Reload after editing: prefix + r

# --- Terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
# 24-bit colour for the outer terminals that support it (fixed indexes, so a
# reload doesn't append duplicates)
set -s 'terminal-features[100]' 'xterm-256color:RGB'
set -s 'terminal-features[101]' 'xterm-kitty:RGB'
# Esc reaches vim, Claude Code and Codex without a delay (3.4 defaults to 500 ms)
set -sg escape-time 10
# focus in/out events reach the apps inside
set -g focus-events on
# OSC 52: text copied in tmux lands on the local clipboard, even over SSH
set -g set-clipboard on

# --- Behaviour ----------------------------------------------------------------
set -g mouse on                 # wheel scrolls, click picks a pane, drag resizes
set -g history-limit 50000      # scrollback lines per pane (default 2000)
set -g base-index 1             # windows and panes count from 1
setw -g pane-base-index 1
set -g renumber-windows on      # no gaps after a window closes
setw -g mode-keys vi            # vi keys in copy mode
set -g display-time 2000        # messages stay up 2 s

# --- Keys ---------------------------------------------------------------------
# splits and new windows open in the current pane's directory
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# copy mode: v starts a selection, y copies it and leaves
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Status bar ---------------------------------------------------------------
# pane title (Claude Code puts its session topic there), host name, time
set -g status-right '"#{=21:pane_title}" #h %H:%M'
set -g status-right-length 60
