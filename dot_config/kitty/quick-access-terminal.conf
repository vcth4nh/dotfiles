# Settings for `kitten quick-access-terminal`: a drop-down kitty that slides in from the
# top of the screen on a global hotkey, over any app.
#
# One-time macOS setup: run `kitten quick-access-terminal` once inside kitty, close the
# window it opens (ctrl+d), then go to System Settings → Keyboard → Keyboard Shortcuts →
# Services → General → "Quick access to kitty" and assign a key (for example ⌥Space).

edge                top
