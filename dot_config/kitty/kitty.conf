# kitty.conf: the whole kitty config, written for kitty 0.50.
# Managed with chezmoi (github.com/vcth4nh/dotfiles). After editing it here,
# run `chezmoi re-add` to copy it back into the repo.
#
# Reload without restarting kitty: ctrl+cmd+,   (or ⌘B then r)
# See every shortcut, searchable: ⌘B then ?   (kitty's command palette)
# Every option kitty has: https://sw.kovidgoyal.net/kitty/conf/
#
# kitty.conf has no trailing comments, so every comment sits on its own line.

# ── Colors ──────────────────────────────────────────────────────────
# Colors come from current-theme.conf (Catppuccin Mocha) in both macOS Dark and Light mode.
# Keep *-theme.auto.conf files out of this folder: kitty would use them instead and
# switch colors with macOS again. `kitten themes` previews other themes and can
# replace the block below.
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# ── Glass ───────────────────────────────────────────────────────────
background_opacity            0.92
background_blur               24
# ctrl+shift+a then 1 = fully opaque, then d = back to glass
dynamic_background_opacity    yes
window_padding_width          10 14

# ── Font ────────────────────────────────────────────────────────────
# JetBrains Mono, installed with `brew install --cask font-jetbrains-mono`.
# Ligatures (-> != ===) are drawn as single glyphs, except under the cursor.
font_family                   JetBrains Mono
font_size                     15
disable_ligatures             cursor

# ── Motion & effects ────────────────────────────────────────────────
# The cursor leaves a comet trail when it jumps; the motion-blur shader makes it glide
# instead of hop. dim-inactive-windows dims the split you are not typing in, background too.
# Both effects are kitty's built-in shaders. Turn them off by emptying custom_shaders;
# set cursor_trail to 0 to drop the trail.
cursor_trail                  3
custom_shaders                cursor-trail-motion-blur dim-inactive-windows
# The inactive split's text also fades a little on top of that.
inactive_text_alpha           0.65

# ── Tabs ────────────────────────────────────────────────────────────
# The tabs use the powerline style to match your ccstatusline.
# Each tab shows: its number, a spinner (or %) while something reports progress
# (Claude Code does while it works), the title, and a magnifier when a split is zoomed.
# The active tab also shows "⌘B ▸" while the tmux mode below is waiting for a key.
tab_bar_edge                  top
tab_bar_style                 powerline
tab_powerline_style           round
tab_title_max_length          30
tab_title_template            "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{index} {tab.last_focused_progress_percent}{title}{' 󰍉' if layout_name == 'stack' and num_windows > 1 else ''}"
active_tab_title_template     "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{'⌘B ▸ ' if keyboard_mode == 'tmux' else '⇔ resize ▸ ' if keyboard_mode == 'resize' else ''}{index} {tab.last_focused_progress_percent}{title}{' 󰍉' if layout_name == 'stack' and num_windows > 1 else ''}"

# ── Splits & tabs ───────────────────────────────────────────────────
# These ⌘ shortcuts work without a prefix.
#   ⌘D   split right          ⌘⌥ arrows  move between splits     ⌘T    new tab, same folder
#   ⌘⇧D  split down           ⌘⇧↩        zoom / unzoom a split   ⌘1–9  go to tab N
#   ⌘W   close split (asks first if a program is still running in it)
# Ubuntu habits that already work: ⌃⇧C / ⌃⇧V copy / paste, ⌃⇧T new tab, ⌃⇧N new window.
enabled_layouts               splits,stack
map cmd+d                     launch --location=vsplit --cwd=current
map cmd+shift+d               launch --location=hsplit --cwd=current
map cmd+w                     close_window_with_confirmation ignore-shell
map cmd+t                     new_tab_with_cwd
map cmd+shift+enter           toggle_layout stack
map cmd+opt+left              neighboring_window left
map cmd+opt+right             neighboring_window right
map cmd+opt+up                neighboring_window up
map cmd+opt+down              neighboring_window down
map cmd+1                     goto_tab 1
map cmd+2                     goto_tab 2
map cmd+3                     goto_tab 3
map cmd+4                     goto_tab 4
map cmd+5                     goto_tab 5
map cmd+6                     goto_tab 6
map cmd+7                     goto_tab 7
map cmd+8                     goto_tab 8
map cmd+9                     goto_tab 9
# Ubuntu-style: ⌥1–9 (left Option) also goes to tab N.
map opt+1                     goto_tab 1
map opt+2                     goto_tab 2
map opt+3                     goto_tab 3
map opt+4                     goto_tab 4
map opt+5                     goto_tab 5
map opt+6                     goto_tab 6
map opt+7                     goto_tab 7
map opt+8                     goto_tab 8
map opt+9                     goto_tab 9

# ── tmux mode ───────────────────────────────────────────────────────
# Press ⌘B, then a tmux key. Same letters as tmux, so muscle memory carries over.
# ⌃B is left alone on purpose: it belongs to herdr (local and --remote) and to Claude Code.
#   % | v  split right      " -  split down       arrows / hjkl  move between splits
#   z  zoom                 x  close split         o  next split    ;  previous split
#   c  new tab              n p  next / prev tab   1–9  go to tab   ,  rename tab
#   &  close tab            w  pick a tab          q  number the splits, press one to jump
#   { }  swap split back / forward                 !  move split to its own tab
#   space  rotate splits    [  search scrollback   ?  command palette   r  reload config
#   H J K L  resize: keep pressing hjkl or arrows, stops after a second of no presses
# The mode cancels itself after 3 seconds, or with esc.
map --new-mode tmux --on-action end --on-unknown end --timeout 3 cmd+b
map --mode tmux %                 launch --location=vsplit --cwd=current
map --mode tmux |                 launch --location=vsplit --cwd=current
map --mode tmux v                 launch --location=vsplit --cwd=current
map --mode tmux shift+apostrophe  launch --location=hsplit --cwd=current
map --mode tmux -                 launch --location=hsplit --cwd=current
map --mode tmux left              neighboring_window left
map --mode tmux right             neighboring_window right
map --mode tmux up                neighboring_window up
map --mode tmux down              neighboring_window down
map --mode tmux h                 neighboring_window left
map --mode tmux j                 neighboring_window down
map --mode tmux k                 neighboring_window up
map --mode tmux l                 neighboring_window right
map --mode tmux o                 next_window
map --mode tmux ;                 nth_window -1
map --mode tmux z                 toggle_layout stack
map --mode tmux x                 close_window_with_confirmation ignore-shell
map --mode tmux c                 new_tab_with_cwd
map --mode tmux n                 next_tab
map --mode tmux p                 previous_tab
map --mode tmux 1                 goto_tab 1
map --mode tmux 2                 goto_tab 2
map --mode tmux 3                 goto_tab 3
map --mode tmux 4                 goto_tab 4
map --mode tmux 5                 goto_tab 5
map --mode tmux 6                 goto_tab 6
map --mode tmux 7                 goto_tab 7
map --mode tmux 8                 goto_tab 8
map --mode tmux 9                 goto_tab 9
map --mode tmux ,                 set_tab_title
map --mode tmux &                 close_tab
map --mode tmux w                 select_tab
map --mode tmux q                 focus_visible_window
map --mode tmux {                 move_window_backward
map --mode tmux }                 move_window_forward
map --mode tmux !                 detach_window new-tab
map --mode tmux space             layout_action rotate
map --mode tmux [                 search_scrollback
map --mode tmux ?                 command_palette
map --mode tmux r                 load_config_file
map --mode tmux shift+h           combine : push_keyboard_mode resize : resize_window narrower
map --mode tmux shift+l           combine : push_keyboard_mode resize : resize_window wider
map --mode tmux shift+k           combine : push_keyboard_mode resize : resize_window taller
map --mode tmux shift+j           combine : push_keyboard_mode resize : resize_window shorter
map --mode tmux esc               pop_keyboard_mode
map --mode tmux cmd+b             pop_keyboard_mode

# Resize mode. Enter it with ⌘B H/J/K/L, or directly with ⌃⌘R.
map --new-mode resize --on-unknown end --timeout 1 ctrl+cmd+r
map --mode resize h               resize_window narrower
map --mode resize l               resize_window wider
map --mode resize k               resize_window taller
map --mode resize j               resize_window shorter
map --mode resize shift+h         resize_window narrower
map --mode resize shift+l         resize_window wider
map --mode resize shift+k         resize_window taller
map --mode resize shift+j         resize_window shorter
map --mode resize left            resize_window narrower
map --mode resize right           resize_window wider
map --mode resize up              resize_window taller
map --mode resize down            resize_window shorter
map --mode resize 0               resize_window reset
map --mode resize esc             pop_keyboard_mode
map --mode resize enter           pop_keyboard_mode

# ── Hints ───────────────────────────────────────────────────────────
# Select anything on screen from the keyboard:
#   ⌘E   label every URL; type the letters to open one
#   ⌘⇧E  label every path; paste the chosen one at your prompt
#   ⌘⇧O  label every file:line (Claude Code prints plenty); open it in VS Code at that line
map cmd+e                     kitten hints
map cmd+shift+e               kitten hints --type=path --program=-
map cmd+shift+o               kitten hints --type=linenum --linenum-action=background /usr/local/bin/code -g {path}:{line}

# ── Workflow ────────────────────────────────────────────────────────
# ⌘⇧C: new tab in this folder running Claude Code, shell split on the right.
# When Claude exits, --hold leaves a full kitty shell in its place.
map cmd+shift+c               combine : launch --type=tab --tab-title=claude --cwd=current --hold zsh -lic claude : launch --location=vsplit --cwd=current : neighboring_window left
# ⌘⇧S: fuzzy-pick a host from ~/.ssh/config. Enter attaches herdr there (herdr --remote),
# ⌥Enter opens a plain shell with `kitten ssh`. The host opens in its own tab, named after it.
map cmd+shift+s               launch --type=tab --tab-title=hosts --allow-remote-control zsh -c "$HOME/.config/kitty/ssh-pick.sh"

# ── Notifications ───────────────────────────────────────────────────
# Desktop notification when a command that ran 15s+ finishes somewhere you can't see:
# a background tab, or while kitty itself is in the background.
# A bell in a background tab puts 🔔 on that tab and bounces the Dock icon.
notify_on_cmd_finish          invisible 15
enable_audio_bell             no

# ── Keyboard & text ─────────────────────────────────────────────────
# Left ⌥ acts as Alt (⌥← ⌥→ word jumps, ⌥⌫ delete word); right ⌥ still types é ñ ö.
macos_option_as_alt           left
strip_trailing_spaces         smart
show_hyperlink_targets        yes
scrollback_lines              20000

# ── Mouse & clipboard ───────────────────────────────────────────────
# Selecting text copies it straight to the clipboard, so ⌘V pastes it anywhere.
# In apps that take over the mouse (herdr, Claude Code's fullscreen view, vim),
# hold ⇧ while dragging to select with kitty instead.
copy_on_select                clipboard

# ── Powerline / icon glyphs ─────────────────────────────────────────
# Use kitty's built-in Nerd Font for them even though ~100 patched fonts are installed
# (line from kitty's own FAQ, with one duplicated range removed).
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
